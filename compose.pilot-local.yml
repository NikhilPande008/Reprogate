services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triage_pilot
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: local-pilot-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage_pilot"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pilot-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.pilot-local
    environment: &pilot_environment
      DATABASE_URL: postgresql+psycopg://triage:local-pilot-only@database:5432/triage_pilot
      GITHUB_AUTO_POST_ENABLED: "false"
      GITHUB_AUTO_POST_DRY_RUN: "true"
      GITHUB_AUTO_POST_REPOSITORIES: ""
      PILOT_REVIEW_ENABLED: "false"
    command: alembic upgrade head
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.pilot-local
    environment: *pilot_environment
    command: uvicorn triage.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.pilot-local
    environment: *pilot_environment
    command: triage worker --once
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pilot-postgres:
